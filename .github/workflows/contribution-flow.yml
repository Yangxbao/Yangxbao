name: ✨ 生成贡献日历流光动画

on:
  schedule:
    - cron: "30 18 * * *"   # 每天北京时间 02:30 自动刷新
  workflow_dispatch:          # 支持手动触发
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成点阵流光贡献日历（亮 / 暗双主题）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contribution_flow.py

      - name: 发布到 output 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
