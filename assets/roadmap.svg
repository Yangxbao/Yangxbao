<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 340" width="1180" height="340" role="img" aria-label="学习路线:2026.09 起步,2026.10 全栈项目密集落地,2026.11 走向真实场景,进行中补强与打磨,下一步探索">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0E1830"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="rprog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="0.8" stop-color="#E3B341"/>
      <stop offset="1" stop-color="#E3B341" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="rglowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rglowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="rsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1180" height="340" rx="26" fill="url(#rbg)"/>
  <rect x="0" y="0" width="1180" height="340" rx="26" fill="url(#rgrid)"/>
  <ellipse cx="180" cy="40" rx="220" ry="130" fill="url(#rglowB)" filter="url(#rsoft)"/>
  <ellipse cx="1020" cy="300" rx="220" ry="130" fill="url(#rglowV)" filter="url(#rsoft)"/>
  <rect x="0.75" y="0.75" width="1178.5" height="338.5" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
    <text x="64" y="70" font-size="23" font-weight="800" fill="#F0F6FC">学习路线</text>
    <text x="160" y="70" font-size="14" fill="#8B949E">· 从课堂项目到真实工程,持续更新</text>

    <!-- legend -->
    <g font-size="13" fill="#8B949E">
