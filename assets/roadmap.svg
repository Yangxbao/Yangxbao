      <text x="790" y="146" font-size="12.5" fill="#8B949E">算法与八股持续补强</text>

      <text x="1020" y="248" font-size="16" font-weight="700" fill="#E6EDF3">探索</text>
      <text x="1020" y="271" font-size="12.5" fill="#8B949E">向量数据库 · 多 Agent</text>
      <text x="1020" y="290" font-size="12.5" fill="#8B949E">实习实践</text>
    </g>
  </g>
