<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" role="img" aria-label="个人技术成长路线图:起步期已完成,阶段一 Java 后端基础巩固进行中,阶段二 Python 与 AI Agent 入门进行中,阶段三 AI Agent 工程化进阶进行中,阶段四 Java 与 AI 全栈项目主体已落地,阶段五求职冲刺计划中,最终目标 2027 暑期实习">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0E1830"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="rprog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="0.55" stop-color="#E3B341"/>
      <stop offset="1" stop-color="#E3B341" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="rbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="rglowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rglowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rglowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3B341" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E3B341" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="rsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1180" height="600" rx="26" fill="url(#rbg)"/>
  <rect x="0" y="0" width="1180" height="600" rx="26" fill="url(#rgrid)"/>
  <ellipse cx="190" cy="50" rx="220" ry="130" fill="url(#rglowB)" filter="url(#rsoft)"/>
  <ellipse cx="1000" cy="300" rx="220" ry="150" fill="url(#rglowV)" filter="url(#rsoft)"/>
  <ellipse cx="1060" cy="270" rx="120" ry="90" fill="url(#rglowG)" filter="url(#rsoft)"/>
  <rect x="0.75" y="0.75" width="1178.5" height="598.5" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
    <!-- header -->
    <text x="64" y="62" font-size="23" font-weight="800" fill="#F0F6FC">学习路线图</text>
    <text x="196" y="62" font-size="13.5" fill="#8B949E">· 2026.11 → 2027 暑期实习</text>
    <g font-size="12.5" fill="#C9D1D9">
      <circle cx="836" cy="58" r="4.5" fill="#58A6FF"/>
      <text x="848" y="63">Java 路线</text>
      <circle cx="932" cy="58" r="4.5" fill="#A78BFA"/>
      <text x="944" y="63">AI 路线</text>
      <circle cx="1022" cy="58" r="4.5" fill="url(#rbar)"/>
      <text x="1034" y="63">汇合</text>
    </g>
    <g font-size="12.5" fill="#8B949E">
      <rect x="830" y="78" width="9" height="9" rx="2" fill="#3FB950"/>
      <text x="846" y="87">已实践</text>
      <rect x="920" y="78" width="9" height="9" rx="2" fill="#E3B341"/>
      <text x="936" y="87">进行中</text>
      <rect x="1010" y="78" width="9" height="9" rx="2" fill="none" stroke="#8B949E" stroke-width="1.5"/>
      <text x="1026" y="87">计划中</text>
    </g>

    <!-- time axis -->
    <line x1="70" y1="140" x2="1110" y2="140" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <g font-size="11" fill="#8B949E" text-anchor="middle">
      <text x="92" y="130" text-anchor="start">2026.09</text>
      <text x="243" y="130">2026.11</text>
      <text x="417" y="130">2027.01</text>
      <text x="590" y="130">2027.03</text>
      <text x="763" y="130">2027.05</text>
      <text x="937" y="130">2027.07</text>
      <text x="1060" y="130" fill="#E3B341">暑期</text>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.18">
      <line x1="243" y1="136" x2="243" y2="144"/>
      <line x1="417" y1="136" x2="417" y2="144"/>
      <line x1="590" y1="136" x2="590" y2="144"/>
      <line x1="763" y1="136" x2="763" y2="144"/>
      <line x1="937" y1="136" x2="937" y2="144"/>
    </g>

    <!-- pre-phase (already done) -->
    <rect x="70" y="246" width="172" height="70" rx="12" fill="#3FB950" fill-opacity="0.07" stroke="#3FB950" stroke-opacity="0.35"/>
    <text x="156" y="268" font-size="11.5" font-weight="700" fill="#3FB950" text-anchor="middle">起步期 · 已完成</text>
    <text x="156" y="286" font-size="10" fill="#8B949E" text-anchor="middle">游戏 Pages · 6 项目开源</text>
    <text x="156" y="302" font-size="10" fill="#8B949E" text-anchor="middle">DevPilot · 真机 · 文件地图v4</text>
    <path d="M242 268 C 258 262, 246 225, 246 225" fill="none" stroke="#3FB950" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M242 292 C 285 300, 300 335, 328 335" fill="none" stroke="#3FB950" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Java lane -->
    <line x1="420" y1="225" x2="695" y2="225" stroke="#58A6FF" stroke-opacity="0.35" stroke-width="2.5"/>
    <text x="552" y="214" font-size="10.5" fill="#79C0FF" text-anchor="middle">持续巩固 · 算法与八股并行</text>
    <path d="M695 225 C 715 225, 706 280, 722 280" fill="none" stroke="#58A6FF" stroke-opacity="0.55" stroke-width="2.5"/>

    <!-- AI lane -->
    <line x1="243" y1="335" x2="325" y2="335" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M680 335 C 706 335, 700 280, 722 280" fill="none" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="2.5"/>

    <!-- S1 capsule -->
    <rect x="243" y="199" width="177" height="52" rx="13" fill="#111B30" stroke="#58A6FF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="331" y="221" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">阶段一 · Java 基础巩固</text>
    <text x="331" y="240" font-size="10.5" fill="#8B949E" text-anchor="middle">2026.11 – 2026.12</text>
    <circle cx="408" cy="211" r="4" fill="#E3B341"/>
    <text x="331" y="270" font-size="10.5" fill="#8B949E" text-anchor="middle">Spring · MySQL · Redis · MQ · Docker</text>

    <!-- S2 capsule -->
    <rect x="328" y="309" width="175" height="52" rx="13" fill="#111B30" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="415" y="331" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">阶段二 · AI Agent 入门</text>
    <text x="415" y="350" font-size="10.5" fill="#8B949E" text-anchor="middle">2026.12 – 2027.01</text>
    <circle cx="491" cy="321" r="4" fill="#E3B341"/>
    <text x="405" y="380" font-size="10.5" fill="#8B949E" text-anchor="middle">Python · LLM API · 工具调用</text>

    <!-- S3 capsule -->
    <rect x="512" y="309" width="168" height="52" rx="13" fill="#111B30" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="596" y="331" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">阶段三 · Agent 工程化</text>
    <text x="596" y="350" font-size="10.5" fill="#8B949E" text-anchor="middle">2027.01 – 2027.03</text>
    <circle cx="668" cy="321" r="4" fill="#E3B341"/>
    <text x="600" y="380" font-size="10.5" fill="#8B949E" text-anchor="middle">向量库 · 记忆 · MCP · 多 Agent</text>

    <!-- S4 converge capsule -->
    <rect x="722" y="254" width="146" height="52" rx="13" fill="#111B30" stroke="url(#rbar)" stroke-width="2"/>
    <text x="795" y="276" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">阶段四 · 汇合</text>
    <text x="795" y="295" font-size="10.5" fill="#C9D1D9" text-anchor="middle">Java + AI 全栈项目</text>
    <circle cx="856" cy="266" r="4" fill="#E3B341"/>
    <text x="795" y="324" font-size="10.5" fill="#8B949E" text-anchor="middle">整合 · 部署 · 可演示</text>

    <!-- S5 capsule -->
    <rect x="878" y="254" width="132" height="52" rx="13" fill="#111B30" stroke="#E3B341" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="944" y="276" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">阶段五 · 冲刺</text>
    <text x="944" y="295" font-size="10.5" fill="#8B949E" text-anchor="middle">2027.04 – 暑期</text>
    <circle cx="998" cy="266" r="4" fill="none" stroke="#8B949E" stroke-width="1.5"/>
    <text x="944" y="324" font-size="10.5" fill="#8B949E" text-anchor="middle">面试 · 简历 · 投递</text>

    <!-- target flag -->
    <circle cx="1062" cy="280" r="30" fill="none" stroke="#E3B341" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="r" values="28;38;28" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0.08;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <line x1="1040" y1="252" x2="1040" y2="308" stroke="#E3B341" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M1042 252 L1076 262 L1042 272 Z" fill="#E3B341"/>
    <text x="1056" y="294" font-size="13" font-weight="800" fill="#E3B341" text-anchor="middle">2027</text>
    <text x="1056" y="312" font-size="11" font-weight="700" fill="#E3B341" text-anchor="middle">暑期实习</text>

    <!-- milestones -->
    <text x="64" y="452" font-size="12.5" font-weight="700" fill="#8B949E">项目成果节点</text>
    <line x1="90" y1="488" x2="1090" y2="488" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <g>
      <rect x="144" y="482" width="12" height="12" rx="2.5" transform="rotate(45 150 488)" fill="#3FB950"/>
      <rect x="334" y="482" width="12" height="12" rx="2.5" transform="rotate(45 340 488)" fill="#3FB950"/>
      <rect x="554" y="482" width="12" height="12" rx="2.5" transform="rotate(45 560 488)" fill="#3FB950"/>
      <rect x="784" y="482" width="12" height="12" rx="2.5" transform="rotate(45 790 488)" fill="none" stroke="#8B949E" stroke-width="1.5"/>
      <circle cx="1005" cy="488" r="7.5" fill="#E3B341"/>
    </g>
    <g text-anchor="middle">
      <text x="150" y="516" font-size="11" fill="#C9D1D9">2026.10 · OfferDojo</text>
      <text x="150" y="534" font-size="10.5" fill="#8B949E">220 任务 + 125 八股</text>
      <text x="340" y="516" font-size="11" fill="#C9D1D9">2026.10 · RAG 双落地</text>
      <text x="340" y="534" font-size="10.5" fill="#8B949E">repopilot-ai · docmind</text>
      <text x="560" y="516" font-size="11" fill="#C9D1D9">2026.11 · DevPilot</text>
      <text x="560" y="534" font-size="10.5" fill="#8B949E">三端平台 · 54 测试 + 18 步 E2E</text>
      <text x="790" y="516" font-size="11" fill="#8B949E">2027.04 · 综合项目升级</text>
      <text x="790" y="534" font-size="10.5" fill="#6E7681">可部署 · 可演示(计划)</text>
      <text x="1005" y="516" font-size="11" font-weight="700" fill="#E3B341">2027 暑期 · 实习 offer</text>
      <text x="1005" y="534" font-size="10.5" fill="#8B949E">冲刺终点</text>
    </g>
  </g>
</svg>
