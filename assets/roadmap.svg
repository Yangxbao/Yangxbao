      <circle cx="890" cy="65" r="5" fill="#E3B341"/>
      <text x="902" y="70">进行中</text>
      <circle cx="980" cy="65" r="5" fill="#58A6FF"/>
      <text x="992" y="70">计划中</text>
    </g>

    <!-- timeline -->
    <line x1="100" y1="205" x2="1060" y2="205" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <line x1="100" y1="205" x2="800" y2="205" stroke="url(#rprog)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- dates -->
    <g font-size="13" fill="#8B949E" text-anchor="middle">
      <text x="130" y="180">2026.09</text>
      <text x="350" y="180">2026.10</text>
      <text x="570" y="180">2026.11</text>
      <text x="790" y="180" fill="#E3B341">进行中</text>
      <text x="1020" y="180" fill="#58A6FF">下一步</text>
    </g>

    <!-- nodes -->
    <g>
      <circle cx="130" cy="205" r="13" fill="none" stroke="#3FB950" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="130" cy="205" r="8" fill="#3FB950"/>
      <circle cx="350" cy="205" r="13" fill="none" stroke="#3FB950" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="350" cy="205" r="8" fill="#3FB950"/>
      <circle cx="570" cy="205" r="13" fill="none" stroke="#3FB950" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="570" cy="205" r="8" fill="#3FB950"/>
      <circle cx="790" cy="205" r="14" fill="none" stroke="#E3B341" stroke-opacity="0.45" stroke-width="2">
        <animate attributeName="r" values="13;19;13" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0.08;0.45" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="205" r="9" fill="#E3B341"/>
      <circle cx="1020" cy="205" r="8" fill="#0B1220" stroke="#58A6FF" stroke-width="2.5" stroke-dasharray="4 3"/>
    </g>

    <!-- labels: below for 1,3,5 / above for 2,4 -->
    <g text-anchor="middle">
      <text x="130" y="248" font-size="16" font-weight="700" fill="#E6EDF3">起步</text>
      <text x="130" y="271" font-size="12.5" fill="#8B949E">HTML 游戏合集</text>
      <text x="130" y="290" font-size="12.5" fill="#8B949E">上线 GitHub Pages</text>

      <text x="350" y="100" font-size="16" font-weight="700" fill="#E6EDF3">全栈项目密集落地</text>
      <text x="350" y="124" font-size="12.5" fill="#8B949E">OfferDojo / docmind 等</text>
      <text x="350" y="146" font-size="12.5" fill="#8B949E">六个项目陆续开源</text>

      <text x="570" y="248" font-size="16" font-weight="700" fill="#E6EDF3">走向真实场景</text>
      <text x="570" y="271" font-size="12.5" fill="#8B949E">DevPilot 平台化 · 真机验收</text>
